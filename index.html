<style>
:root{--bg:#091c29;--panel:#102b3a;--ink:#f1f6ee;--muted:#a9bdc6;--lime:#d4f48b;--teal:#66c6bb;--line:#2b4653;--gold:#ffc785}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}button,a,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:5px}button{color:inherit}header{max-width:1440px;margin:auto;padding:22px 4%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:16px}.brand{display:flex;align-items:center;gap:12px;font-weight:750;line-height:1.25}.logo{border:1px solid var(--teal);color:var(--lime);width:38px;height:44px;display:grid;place-items:center;clip-path:polygon(0 0,100% 0,100% 75%,50% 100%,0 75%);background:#234c50}.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:5px}.tools{display:flex;gap:9px}.quiet{background:transparent;border:1px solid var(--line);border-radius:9px;padding:9px 14px;font-size:13px}.quiet:hover{border-color:var(--teal)}main{max-width:1440px;margin:auto;padding:30px 4% 16px}.path{display:flex;gap:8px;margin-bottom:25px}.step{flex:1;border-top:3px solid var(--line);padding-top:9px;font-size:11px;color:var(--muted);letter-spacing:.5px}.step.active{border-color:var(--lime);color:var(--lime)}.step.done{border-color:var(--teal)}.layout{display:grid;grid-template-columns:1.1fr 1fr;min-height:570px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--panel)}.visual{position:relative;min-height:480px;background:radial-gradient(ellipse at 40% 30%,#245963, #0d2637 72%);overflow:hidden;display:flex;flex-direction:column;justify-content:center}.visual:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,#00000008 4px)}.scene-head{position:absolute;top:25px;left:26px;right:26px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:#c7dedc;z-index:1}.live{color:var(--lime)}.art{width:100%;height:auto;max-height:480px}.scene-caption{position:absolute;bottom:24px;left:26px;right:26px;display:flex;justify-content:space-between;color:#c0d7db;font-size:11px;letter-spacing:1px}.content{padding:38px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:11px;font-weight:750;letter-spacing:2px;color:var(--teal);text-transform:uppercase}h1{font-size:clamp(36px,4.4vw,64px);line-height:1.05;letter-spacing:-2px;margin:20px 0}h1 em{font-style:normal;color:var(--lime)}h2{font-size:30px;line-height:1.15;letter-spacing:-.7px;margin:15px 0}p{color:var(--muted);margin:10px 0 19px}.lead{font-size:17px;max-width:46ch}.btn{background:var(--lime);color:#172b24;border:0;padding:15px 21px;border-radius:10px;font-weight:750;text-decoration:none;display:inline-block;text-align:center}.btn:hover{filter:brightness(1.06)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.meta{display:flex;gap:20px;margin:10px 0 26px;color:var(--muted);font-size:12px}.quote{border-left:2px solid var(--teal);padding:15px 18px;background:#ffffff05;border-radius:0 10px 10px 0;margin:17px 0;color:#e2ecec}.person{display:flex;align-items:center;gap:12px;font-size:13px;margin:10px 0}.avatar{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#34565d;color:var(--lime);font-weight:750}.person small{display:block;color:var(--muted)}.options{display:grid;gap:10px;margin-top:15px}.option{display:flex;text-align:left;gap:12px;align-items:center;width:100%;border:1px solid #3a5661;background:#173342;padding:14px;border-radius:10px;font-size:14px}.option:hover{background:#224955;border-color:var(--teal)}.option.selected{border-color:var(--lime);background:#2b483e}.letter{flex:none;display:grid;place-items:center;width:28px;height:28px;border:1px solid #55737a;border-radius:6px;font-size:12px;color:var(--lime)}.note{font-size:12px;color:var(--muted)}.tag{display:inline-block;border:1px solid #486459;border-radius:30px;padding:4px 10px;color:var(--lime);font-size:11px}.hotspots{display:flex;gap:10px;position:absolute;left:22px;right:22px;bottom:65px;z-index:2;justify-content:center;flex-wrap:wrap}.hotspot{background:#0b2330ed;border:1px solid var(--teal);padding:11px 14px;border-radius:9px;font-size:12px;box-shadow:0 4px 25px #0005}.hotspot:hover{background:#2c5759}.pulse{animation:pulse 2s infinite}.paper{background:#e9efe4;color:#253d3c;padding:20px;border-radius:9px;box-shadow:0 12px 35px #0003;margin:16px 0}.paper p{color:#415553;font-size:14px}.paper h3{margin:8px 0;font-size:18px}.paper small{font-size:10px;letter-spacing:1px}.paper .stamp{border-top:1px solid #bac8b8;padding-top:8px;font-size:11px;color:#546b61}textarea{resize:vertical;width:100%;min-height:100px;border:1px solid var(--line);background:#0b2230;color:var(--ink);padding:13px;border-radius:9px;margin-top:8px}label{font-size:13px}footer{max-width:1440px;margin:auto;padding:17px 4% 25px;display:flex;justify-content:space-between;gap:16px;font-size:10px;color:#91aab7;letter-spacing:.5px}.enter{animation:enter .4s ease}dialog{background:#102b3a;color:var(--ink);border:1px solid #52747b;border-radius:18px;width:min(620px,92vw);max-height:85vh;padding:25px}dialog::backdrop{background:#020c17ce;backdrop-filter:blur(5px)}dialog h2{font-size:24px}.dialog-top{display:flex;justify-content:space-between;align-items:center;gap:20px}.status{font-size:12px;color:var(--gold);min-height:20px}.recap{border:1px solid var(--line);border-radius:12px;padding:17px;margin:12px 0}.recap p{font-size:13px;margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}.recap strong{font-size:12px;color:var(--teal)}@keyframes enter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{50%{box-shadow:0 0 0 7px #66c6bb18}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}@media(max-width:850px){.layout{grid-template-columns:1fr}.visual{min-height:300px;max-height:360px}.art{height:340px}.content{padding:26px}.scene-head{top:18px}.scene-caption{bottom:14px}.hotspots{bottom:42px}h1{font-size:44px}.step{font-size:9px}.brand small{font-size:8px}main{padding-top:20px}footer{flex-direction:column;gap:3px}.tools .quiet{padding:8px;font-size:11px}}@media(max-width:420px){.step span{display:none}.content{padding:23px}.visual{min-height:270px}.tools{gap:4px}.brand{font-size:13px}.hotspot{padding:10px;font-size:11px}.scene-head{font-size:9px}.meta{gap:12px}}

<header><div class="brand"><div class="logo" aria-hidden="true">✓</div><div>MISSÃO INTEGRIDADE<small>SEMANA DA INTEGRIDADE · DIA 01</small></div></div><div class="tools"><button class="quiet" id="bag">Pasta de pistas <span id="count">0/3</span></button><button class="quiet" id="help" aria-label="Como jogar">?</button></div></header>

<script>
/* CONFIGURAÇÃO PARA PUBLICAÇÃO
 1. Cole abaixo o link do Microsoft Forms, mantendo as aspas.

const CONFIG = { formsUrl: "", organization: "SEMANA DA INTEGRIDADE" };
const stages=['Início','O pedido','A conversa','As pistas','A pressão','A decisão','Seu percurso'];
let stage=0,chat=0,clues=new Set(),branch=-1,reaction=-1,choice=-1,reason='';
const choices=['Seguir com a indicação, desde que preço e prazo sejam adequados.','Informar o vínculo e buscar orientação antes de avançar.','Descartar imediatamente a empresa por causa do vínculo familiar.'];
const evidence=[{title:'01 · Proposta comercial',type:'DOCUMENTO / COMERCIAL',body:'A empresa indicada oferece o serviço dentro do prazo solicitado. O valor está dentro do orçamento. Ainda não houve comparação com outras propostas.',foot:'Uma proposta viável resolve, sozinha, toda a análise?'},{title:'02 · E-mail de indicação',type:'MENSAGEM / CONTEXTO',body:'Rafael enviou o contato diretamente para você. No e-mail encaminhado à equipe, o vínculo familiar não foi mencionado. Você soube dessa relação apenas na conversa privada.',foot:'Quem precisa conhecer essa informação para avaliar a indicação?'},{title:'03 · Nota para reflexão',type:'PISTA / REFLEXÃO ÉTICA',body:'Uma relação pessoal pode influenciar — ou parecer influenciar — uma decisão profissional. Tornar essa relação conhecida permite avaliar o caso com transparência.',foot:'Material educativo fictício. Não substitui as políticas da empresa.'}];
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function svg(kind){let windows='<g fill="#23535f" stroke="#64938f" stroke-width="2"><path d="M100 80h390v190H100z"/><path d="M230 80v190M360 80v190M100 175h390"/></g><g fill="#79a6a2" opacity=".35"><path d="M115 160v-40h40v40zm55 0v-60h40v60zm80 0v-35h42v35zm65 0v-65h30v65zm62 0v-42h50v42zm65 0v-65h30v65z"/></g>';
let plant='<g><path d="M480 335v-75" stroke="#7fbb9b" stroke-width="6"/><path d="M480 302q-65-35-40-60 40 0 40 60M480 285q5-65 40-50 15 30-40 50" fill="#5c9983"/><path d="M455 326h50l-8 43h-34z" fill="#c3bb94"/></g>';
let desk='<path d="M100 310l235-75 195 102-235 86z" fill="#abbdad"/><path d="M100 310v14l195 114v-15z" fill="#708e85"/><path d="M295 423l235-86v14l-235 87z" fill="#4c726f"/><path d="M123 336v80m172 22v62m210-138v70" stroke="#345760" stroke-width="13"/><path d="M230 175l126 35v101l-126-37z" fill="#092431" stroke="#7aa79f" stroke-width="5"/><path d="M242 192l102 28v72l-102-30z" fill="#2d5c63"/><path d="M259 219l62 18m-62-2 41 12" stroke="#cdeba1" stroke-width="4"/><path d="M288 294v35m-27 0 57 16" stroke="#3c6060" stroke-width="8"/><path d="M213 329l83 25-29 11-80-25z" fill="#536f71"/>';
let body=windows+plant+desk;
if(kind==='lobby')body='<path d="M95 350V112l220-66 188 89v217l-211 83z" fill="#214756" stroke="#517d80" stroke-width="2"/><path d="M315 46v305l-23 84V130z" fill="#34636b"/><path d="M335 149l143 58v135l-143-55z" fill="#0f303f" stroke="#76a6a0" stroke-width="2"/><path d="M405 177v137" stroke="#76a6a0" stroke-width="2"/><path d="M125 149l139-41v70l-139 43z" fill="#0b2936"/><text x="143" y="176" fill="#d4f48b" font-size="18" transform="rotate(-16 143 176)" font-family="sans-serif">INTEGRIDADE</text><path d="M115 247l116-35v35l-116 34z" fill="#5b8b85"/><path d="M82 354l214 115 228-95-19-22-212 83-198-85z" fill="#678b86"/>'+plant;
if(kind==='phone')body=windows+'<g transform="rotate(-8 300 280)"><rect x="200" y="100" width="200" height="330" rx="25" fill="#09212f" stroke="#81aaa2" stroke-width="5"/><rect x="215" y="130" width="170" height="270" rx="8" fill="#173d49"/><path d="M270 115h60" stroke="#81aaa2" stroke-width="4"/><rect x="230" y="158" width="133" height="53" rx="9" fill="#365b64"/><rect x="253" y="227" width="112" height="48" rx="9" fill="#5d8272"/><rect x="230" y="292" width="133" height="65" rx="9" fill="#365b64"/><path d="M244 176h94m-94 14h65m15 56h72m-112 64h94m-94 17h72" stroke="#bdd5ca" stroke-width="4"/></g>';
if(kind==='evidence')body='<path d="M60 155l290-68 212 120-283 105z" fill="#224853"/><path d="M60 155v250l219 113V312z" fill="#16333f"/><path d="M279 312l283-105v227L279 518z" fill="#1a3d48"/><g transform="translate(128 144) rotate(-13)"><rect width="149" height="180" rx="5" fill="#e0e8d5"/><path d="M23 33h100M23 57h80M23 78h98M23 100h65" stroke="#6a8b82" stroke-width="7"/><circle cx="104" cy="144" r="18" fill="none" stroke="#579589" stroke-width="5"/></g><g transform="translate(336 207) rotate(12)"><rect width="145" height="105" rx="5" fill="#8fb4a3"/><path d="M4 4l68 58 69-58" fill="none" stroke="#416c6a" stroke-width="3"/></g><circle cx="345" cy="375" r="42" fill="#74c5b12a" stroke="#c8e69b" stroke-width="9"/><path d="M375 407l42 43" stroke="#c8e69b" stroke-width="13"/>';
if(kind==='meeting')body=windows+'<circle cx="437" cy="118" r="26" fill="#d0ddbb"/><path d="M437 101v19l13 7" fill="none" stroke="#345962" stroke-width="4"/><path d="M112 335l220-75 192 80-222 91z" fill="#779b91"/><path d="M302 431v58m-164-133v69m354-69v69" stroke="#2d5662" stroke-width="14"/><circle cx="310" cy="219" r="32" fill="#ceaa89"/><path d="M278 211q-8-55 37-34 36-2 29 44l-15-25-42 6z" fill="#18313a"/><path d="M253 297q7-61 57-41 48-18 63 51l-58 18z" fill="#477b79"/><path d="M225 345l76-24 69 28-73 25z" fill="#d6dfc8"/>'+plant;
if(kind==='end')body='<g fill="none" stroke="#527e7a"><circle cx="300" cy="260" r="160"/><circle cx="300" cy="260" r="190" stroke-dasharray="4 12"/></g><path d="M300 105l115 43v124c0 82-115 141-115 141s-115-59-115-141V148z" fill="#285751" stroke="#9cc787" stroke-width="3"/><path d="M245 257l38 38 77-88" fill="none" stroke="#d4f48b" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><circle cx="133" cy="191" r="7" fill="#ffc785"/><circle cx="456" cy="337" r="7" fill="#66c6bb"/>';
return '<svg class="art" viewBox="0 0 620 540" aria-hidden="true"><ellipse cx="310" cy="460" rx="232" ry="45" fill="#061b2866"/>'+body+'</svg>';}
function button(text,act,cls='btn',disabled=false){return `<button class="${cls}" data-act="${act}" ${disabled?'disabled':''}>${text}</button>`}
function visual(kind,name,hot=''){return `<section class="visual"><div class="scene-head"><span>${name}</span><span class="live">● MISSÃO 01</span></div>${svg(kind)}${hot}<div class="scene-caption"><span>CASO 01 / É SÓ UMA INDICAÇÃO</span><span>${stage===0?'INÍCIO':String(stage).padStart(2,'0')+' / 06'}</span></div></section>`}
function render(){let kind='desk',name='09:12 · SEU ESCRITÓRIO',html='',hot='';
if(stage===0){kind='lobby';name='08:55 · UM NOVO EXPEDIENTE';html=`<div class="eyebrow">Uma escolha muda a história</div><h1>Você faria<br><em>o quê?</em></h1><p class="lead">Um prazo apertado. Uma indicação conveniente. Uma informação que muda tudo.</p><p>Assuma o papel de quem precisa decidir. Explore as pistas e descubra o que pesa na sua escolha.</p><div class="meta"><span>◷ Cerca de 5 minutos</span><span>◇ 3 pistas para explorar</span></div>${button('Começar meu expediente →','next')}<p class="note">Sem cronômetro. Sem ranking. No seu ritmo.</p>`;}
if(stage===1){hot=`<div class="hotspots">${button('● Abrir mensagem de Rafael','next','hotspot pulse')}</div>`;html=`<div class="eyebrow">01 / O pedido</div><h2>Seu dia acaba<br>de ganhar uma urgência.</h2><p>Você apoia a contratação de um serviço logístico. A operação precisa de um fornecedor ainda hoje, e a equipe está buscando alternativas.</p><div class="person"><div class="avatar">R</div><div>Rafael<small>Colega de equipe · nova mensagem</small></div></div><div class="quote">“Tenho uma empresa que consegue atender a gente ainda hoje. Vou te mandar a proposta.”</div><p class="note">Toque na mensagem no cenário para continuar.</p>`;}
if(stage===2){kind='phone';name='09:18 · CONVERSA PRIVADA';html='<div class="eyebrow">02 / A conversa</div><h2>Um detalhe<br>fora do e-mail.</h2><div class="person"><div class="avatar">R</div><div>Rafael<small>Colega de equipe</small></div></div>';
if(chat===0)html+='<div class="quote">“Só uma coisa: a empresa é do meu cunhado. Mas o serviço é ótimo! Como estamos com pressa, dá para seguir sem entrar nesse detalhe, né?”</div><p>Você quer entender melhor. Como começa essa conversa?</p><div class="options">'+button('Me explica melhor essa relação.','branch0','option')+button('Como foi feita essa indicação?','branch1','option')+'</div>';
else html+=`<span class="tag">Você: ${branch===0?'Me explica melhor essa relação.':'Como foi feita essa indicação?'}</span><div class="quote">${branch===0?'“É da família da minha esposa. Já vi o trabalho dele, por isso indiquei. Só não quero que esse detalhe atrapalhe.”':'“Eu mandei o contato direto para você. Ainda não consultamos outras empresas. Achei que seria mais rápido assim.”'}</div><p>A indicação pode ser útil. Mas agora você tem uma informação que o restante da equipe não recebeu.</p>${button('Investigar antes de decidir →','next')}`;}
if(stage===3){kind='evidence';name='09:35 · SALA DE ANÁLISE';hot='<div class="hotspots">'+evidence.map((e,i)=>button((clues.has(i)?'✓ ':'＋ ')+['Proposta','E-mail','Nota'][i],'clue'+i,'hotspot')).join('')+'</div>';html=`<div class="eyebrow">03 / As pistas</div><h2>Antes de agir,<br>amplie o olhar.</h2><p>Uma decisão não precisa se apoiar apenas na primeira mensagem. Explore os três documentos sobre a mesa.</p><span class="tag">${clues.size} de 3 pistas exploradas</span><div class="quote">O que você sabe?<br>O que ainda precisa esclarecer?<br>Quem deveria participar dessa decisão?</div><p class="note">As pistas ficam disponíveis na pasta, no topo da tela.</p>${button('Ir para a reunião →','next','btn',clues.size<3)}`;}
if(stage===4){kind='meeting';name='11:40 · SALA DE REUNIÃO';html='<div class="eyebrow">04 / A pressão</div><h2>O prazo mudou.<br>E o seu critério?</h2><div class="person"><div class="avatar">M</div><div>Marina<small>Liderança da área</small></div></div>';
if(reaction<0)html+='<div class="quote">“Precisamos fechar isso hoje. A operação está esperando. Posso contar com você?”</div><p>Qual seria sua resposta neste momento?</p><div class="options">'+button('“Vou tentar concluir a contratação ainda hoje.”','react0','option')+button('“Existe uma informação que precisamos avaliar antes.”','react1','option')+'</div>';
else html+=`<span class="tag">${reaction===0?'Você sinalizou que tentará concluir hoje.':'Você sinalizou que há algo a avaliar.'}</span><div class="quote">${reaction===0?'“Ótimo. Me atualize assim que tiver uma definição.”':'“Qual informação? Me explique para entendermos o próximo passo.”'}</div><p>${reaction===0?'A expectativa de entrega aumentou. Você ainda pode rever o caminho antes de tomar a decisão.':'Você abriu espaço para conversar. Ainda precisa decidir o que propor e como lidar com o prazo.'}</p>${button('Tomar minha decisão →','next')}`;}
if(stage===5){name='11:55 · DE VOLTA À SUA MESA';html=`<div class="eyebrow">05 / A decisão</div><h2>Agora, é com você.</h2><p>Considerando as pistas e a pressão pelo prazo, qual atitude você adotaria?</p><div class="options">${choices.map((c,i)=>button(`<span class="letter">${'ABC'[i]}</span><span>${c}</span>`,'choose'+i,'option'+(choice===i?' selected':''))).join('')}</div><div style="margin-top:18px"><label for="reason">O que pesou na sua decisão? <span class="note">(obrigatório)</span></label><textarea id="reason" maxlength="1200" placeholder="Explique seu raciocínio e o próximo passo que você daria…">${esc(reason)}</textarea></div><div class="actions">${button('Concluir meu percurso →','next','btn',choice<0||!reason.trim())}</div><p class="note">Não inclua nomes reais ou informações confidenciais.</p>`;}
if(stage===6){kind='end';name='PERCURSO CONCLUÍDO';html=`<div class="eyebrow">06 / Seu percurso</div><h2>Uma decisão.<br>Um compromisso.</h2><p>Você explorou o contexto, enfrentou a pressão e definiu seu próximo passo. Agora, registre sua reflexão.</p><div class="recap"><strong>SUA DECISÃO</strong><p>${esc(choices[choice])}</p><strong>O QUE PESOU NA ESCOLHA</strong><p>${esc(reason)}</p></div><div class="actions">${button('Copiar meu resumo','copy')}${button('Responder no Forms ↗','forms','quiet',!validUrl())}${button('Rever decisão','review','quiet')}</div><div class="status" id="status" role="status"></div><p class="note">${validUrl()?'Copie o resumo e registre sua resposta no formulário. Abrir o Forms não confirma o envio.':'O formulário ainda não foi configurado. Você pode copiar seu resumo; nenhuma resposta foi enviada.'}</p><button class="quiet" data-act="restart">Recomeçar a experiência</button>`;}
$('#path').innerHTML=stages.map((s,i)=>`<div class="step ${i===stage?'active':i<stage?'done':''}" ${i===stage?'aria-current="step"':''}>${i<stage?'✓':String(i).padStart(2,'0')} <span>${s}</span></div>`).join('');$('#game').innerHTML=`<div class="layout enter">${visual(kind,name,hot)}<section class="content" tabindex="-1">${html}</section></div>`;$('#count').textContent=clues.size+'/3';
const ta=$('#reason');if(ta)ta.addEventListener('input',()=>{reason=ta.value;document.querySelector('[data-act="next"]').disabled=choice<0||!reason.trim();});}
function validUrl(){try{return new URL(CONFIG.formsUrl).protocol==='https:'}catch{return false}}
function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').showModal()}
function showEvidence(i){clues.add(i);render();const e=evidence[i];modal(e.title,`<article class="paper"><small>${e.type}</small><h3>${e.title.slice(5)}</h3><p>${e.body}</p><div class="stamp">${e.foot}</div></article>`)}
function summary(){return `MISSÃO INTEGRIDADE — DIA 1\nCaso: É só uma indicação\nPistas exploradas: ${clues.size}/3\nMinha decisão: ${choices[choice]}\nMinha justificativa: ${reason}`;}
function focusContent(){$('.content').focus({preventScroll:true});if(innerWidth<851)$('.content').scrollIntoView({behavior:'auto',block:'start'});}
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
if(a==='next'){if(stage===3&&clues.size<3)return;if(stage===5&&(choice<0||!reason.trim()))return;stage=Math.min(6,stage+1);render();focusContent()}
else if(a.startsWith('branch')){branch=+a.slice(-1);chat=1;render();focusContent()}
else if(a.startsWith('clue'))showEvidence(+a.slice(-1));
else if(a.startsWith('react')){reaction=+a.slice(-1);render();focusContent()}
else if(a.startsWith('choose')){choice=+a.slice(-1);render();document.querySelector('[data-act="'+a+'"]').focus()}
else if(a==='review'){stage=5;render();focusContent()}
else if(a==='copy'){try{await navigator.clipboard.writeText(summary());$('#status').textContent='Resumo copiado. Cole no campo correspondente do Forms.'}catch{modal('Copie seu resumo','<p>Selecione o texto abaixo e copie.</p><textarea id="fallback" readonly aria-label="Resumo para copiar">'+esc(summary())+'</textarea>');$('#fallback').select()}}
else if(a==='forms'&&validUrl()){window.open(CONFIG.formsUrl,'_blank','noopener,noreferrer');$('#status').textContent='Conclua o envio no Forms para registrar sua participação.'}
else if(a==='restart'){modal('Recomeçar a missão?','<p>Sua escolha e justificativa serão apagadas desta sessão.</p>'+button('Sim, recomeçar','reset'))}
else if(a==='reset'){$('#modal').close();stage=0;chat=0;clues.clear();branch=-1;reaction=-1;choice=-1;reason='';render();focusContent()}});
$('#bag').onclick=()=>modal('Sua pasta de pistas',clues.size?Array.from(clues).sort().map(i=>`<article class="paper"><h3>${evidence[i].title}</h3><p>${evidence[i].body}</p><div class="stamp">${evidence[i].foot}</div></article>`).join(''):'<p>As pistas aparecerão aqui quando você explorar os documentos na sala de análise.</p>');
$('#help').onclick=()=>modal('Como jogar','<p>Avance pelos cenários, converse com os personagens e explore as três pistas. Depois, escolha sua atitude e explique seu raciocínio.</p><p>Use os botões ou navegue com Tab e Enter. Não há limite de tempo. Sua resposta fica somente nesta página enquanto ela estiver aberta; recarregar apaga o percurso.</p><p>O registro oficial é feito no Forms ao final. Personagens e situação são fictícios.</p>');
$('#close').onclick=()=>$('#modal').close();render();
</script></body></html>
